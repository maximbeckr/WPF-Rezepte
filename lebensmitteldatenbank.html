<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f0f0f; color: #eee; min-height: 100vh; }

  header { background: #1a1a1a; border-bottom: 1px solid #2a2a2a; padding: 20px 24px; position: sticky; top: 0; z-index: 100; }
  h1 { font-size: 1.3rem; font-weight: 600; color: #fff; margin-bottom: 14px; letter-spacing: 0.02em; }

  .search-row { display: flex; gap: 10px; align-items: center; }
  #search { flex: 1; background: #252525; border: 1px solid #333; border-radius: 8px; color: #eee; font-size: 1rem; padding: 10px 14px; outline: none; transition: border-color .2s; }
  #search:focus { border-color: #555; }
  #search::placeholder { color: #555; }

  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .cat-btn { background: #252525; border: 1px solid #333; border-radius: 20px; color: #999; font-size: 0.78rem; padding: 5px 12px; cursor: pointer; transition: all .15s; white-space: nowrap; }
  .cat-btn:hover { border-color: #555; color: #ccc; }
  .cat-btn.active { background: #333; border-color: #666; color: #fff; }

  #count { font-size: 0.8rem; color: #555; margin-top: 10px; }

  main { padding: 20px 24px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }

  .card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 16px 10px 12px; text-align: center; cursor: pointer; transition: all .15s; user-select: none; }
  .card:hover { background: #222; border-color: #3a3a3a; transform: translateY(-1px); }
  .card:active { transform: translateY(0); }
  .card .emoji { font-size: 2.4rem; display: block; margin-bottom: 8px; line-height: 1; }
  .card .name { font-size: 0.75rem; color: #bbb; line-height: 1.3; word-break: break-word; }
  .card .dl { font-size: 0.65rem; color: #444; margin-top: 5px; }
  .card:hover .dl { color: #666; }

  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 8px; padding: 10px 20px; font-size: 0.85rem; color: #ccc; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 999; }
  #toast.show { opacity: 1; }

  canvas { display: none; }
</style>

const CATS = ["Alle", ...new Set(DB.map(x=>x.k))];

let activeFilter = "Alle";
let searchTerm = "";

function render() {
  const q = searchTerm.toLowerCase();
  const items = DB.filter(x => {
    const catOk = activeFilter === "Alle" || x.k === activeFilter;
    const searchOk = !q || x.n.toLowerCase().includes(q) || x.k.toLowerCase().includes(q);
    return catOk && searchOk;
  });

  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  items.forEach(item => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<span class="emoji">${item.e}</span><div class="name">${item.n}</div><div class="dl">↓ PNG</div>`;
    card.onclick = () => downloadPNG(item);
    grid.appendChild(card);
  });

  document.getElementById("count").textContent = `${items.length} Lebensmittel`;
}

function renderFilters() {
  const row = document.getElementById("filters");
  CATS.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "cat-btn" + (cat === activeFilter ? " active" : "");
    btn.textContent = cat;
    btn.onclick = () => {
      activeFilter = cat;
      document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      render();
    };
    row.appendChild(btn);
  });
}

function downloadPNG(item) {
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const size = 300;
  canvas.width = size;
  canvas.height = size;

  ctx.clearRect(0, 0, size, size);

  // Background
  ctx.fillStyle = "#1a1a1a";
  ctx.beginPath();
  ctx.roundRect(0, 0, size, size, 20);
  ctx.fill();

  // Emoji
  ctx.font = "120px serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(item.e, size / 2, size / 2 - 20);

  // Name
  ctx.font = "bold 22px 'Segoe UI', Arial, sans-serif";
  ctx.fillStyle = "#ffffff";
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  ctx.fillText(item.n, size / 2, size - 48);

  // Category
  ctx.font = "14px 'Segoe UI', Arial, sans-serif";
  ctx.fillStyle = "#666";
  ctx.fillText(item.k, size / 2, size - 24);

  // Download
  const link = document.createElement("a");
  link.download = item.n.replace(/\s+/g, "_") + ".png";
  link.href = canvas.toDataURL("image/png");
  link.click();

  showToast(`${item.n}.png gespeichert`);
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 2000);
}

document.getElementById("search").addEventListener("input", e => {
  searchTerm = e.target.value;
  render();
});

renderFilters();
render();
