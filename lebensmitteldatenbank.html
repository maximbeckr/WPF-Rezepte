<meta charset="UTF-8">

<title>Lebensmittel Datenbank</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f0f0f; color: #eee; min-height: 100vh; }

  header { background: #1a1a1a; border-bottom: 1px solid #2a2a2a; padding: 20px 24px; position: sticky; top: 0; z-index: 100; }
  h1 { font-size: 1.3rem; font-weight: 600; color: #fff; margin-bottom: 14px; }

  #search { width: 100%; background: #252525; border: 1px solid #333; border-radius: 8px; color: #eee; font-size: 1rem; padding: 10px 14px; outline: none; transition: border-color .2s; }
  #search:focus { border-color: #555; }
  #search::placeholder { color: #555; }

  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .cat-btn { background: #252525; border: 1px solid #333; border-radius: 20px; color: #999; font-size: 0.78rem; padding: 5px 12px; cursor: pointer; transition: all .15s; white-space: nowrap; }
  .cat-btn:hover { border-color: #555; color: #ccc; }
  .cat-btn.active { background: #333; border-color: #666; color: #fff; }

  #count { font-size: 0.8rem; color: #555; margin-top: 10px; }

  main { padding: 20px 24px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }

  .card {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: all .15s;
    user-select: none;
  }
  .card:hover { background: #222; border-color: #3a3a3a; transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,0,0,.4); }
  .card:active { transform: translateY(0); }

  .card-img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: contain;
    background: #fff;
    display: block;
    padding: 10px;
  }
  .card-img.error { background: #1a1a1a; padding: 0; }

  .card-body { padding: 10px 10px 8px; }
  .card-name { font-size: 0.8rem; color: #ccc; font-weight: 500; }
  .card-dl { font-size: 0.65rem; color: #444; margin-top: 3px; }
  .card:hover .card-dl { color: #777; }

  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 8px; padding: 10px 20px; font-size: 0.85rem; color: #ccc; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 999; }
  #toast.show { opacity: 1; }

  canvas { display: none; }
</style>
</head>
<body>

  <input id="search" type="search" placeholder="Lebensmittel suchen..." autocomplete="off" />
  <div class="filter-row" id="filters"></div>
  <div id="count"></div>
</header>

<main><div id="grid"></div></main>
<div id="toast"></div>
<canvas id="canvas"></canvas>

const IMG_BASE = "https://www.themealdb.com/images/ingredients/";

const CATS = ["Alle", ...new Set(DB.map(x => x.k))];
let activeFilter = "Alle";
let searchTerm = "";

function imgUrl(img) {
  return IMG_BASE + encodeURIComponent(img) + ".png";
}

function render() {
  const q = searchTerm.toLowerCase();
  const items = DB.filter(x => {
    const catOk = activeFilter === "Alle" || x.k === activeFilter;
    const searchOk = !q || x.n.toLowerCase().includes(q) || x.k.toLowerCase().includes(q);
    return catOk && searchOk;
  });

  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  items.forEach(item => {
    const card = document.createElement("div");
    card.className = "card";

    const img = document.createElement("img");
    img.className = "card-img";
    img.src = imgUrl(item.img);
    img.alt = item.n;
    img.loading = "lazy";
    img.onerror = () => { img.src = ""; img.classList.add("error"); };

    card.innerHTML = `<div class="card-body"><div class="card-name">${item.n}</div><div class="card-dl">↓ PNG herunterladen</div></div>`;
    card.insertBefore(img, card.firstChild);
    card.onclick = () => downloadPNG(item, img);
    grid.appendChild(card);
  });

  document.getElementById("count").textContent = `${items.length} Lebensmittel`;
}

function renderFilters() {
  const row = document.getElementById("filters");
  CATS.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "cat-btn" + (cat === activeFilter ? " active" : "");
    btn.textContent = cat;
    btn.onclick = () => {
      activeFilter = cat;
      document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      render();
    };
    row.appendChild(btn);
  });
}

function downloadPNG(item, imgEl) {
  const size = 400;
  const canvas = document.getElementById("canvas");
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, size, size);

  const draw = () => {
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, size, size);
    const pad = 20;
    ctx.drawImage(imgEl, pad, pad, size - pad * 2, size - pad * 2);

    const link = document.createElement("a");
    link.download = item.n.replace(/\s+/g, "_") + ".png";
    link.href = canvas.toDataURL("image/png");
    link.click();
    showToast(`${item.n}.png gespeichert`);
  };

  if (imgEl.complete && imgEl.naturalWidth > 0) {
    draw();
  } else {
    const tmp = new Image();
    tmp.crossOrigin = "anonymous";
    tmp.src = imgUrl(item.img);
    tmp.onload = () => { ctx.drawImage(tmp, 20, 20, size - 40, size - 40); draw(); };
    tmp.onerror = () => showToast("Bild konnte nicht geladen werden");
  }
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 2200);
}

document.getElementById("search").addEventListener("input", e => {
  searchTerm = e.target.value;
  render();
});

renderFilters();
render();
</script>
